name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Project
        run: bun run build

      - name: Verify build output
        run: |
          if [ ! -f dist/client/index.html ]; then
            echo "❌ index.html not found in dist/client/"
            exit 1
          fi
          echo "✅ index.html generated correctly"
          ls -la dist/client

      - name: Environment isolation guard
        run: |
          if grep -rq "farg-e74ca" dist/client; then
            echo "❌ Staging project id found in production build!"
            exit 1
          fi
          if ! grep -rq "opscore-argus" dist/client; then
            echo "❌ Production project id not found in production build!"
            exit 1
          fi
          echo "✅ Production environment isolation verified"

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}"
          projectId: opscore-argus
          channelId: live
